name: CI - Lint & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build web app
        run: npm run build:web
        env:
          NEXTAUTH_SECRET: ci-test-secret-do-not-use-in-production
          # Only needs to be a syntactically valid Postgres URL — prisma generate
          # doesn't connect to it, and db push is skipped outside Vercel (VERCEL
          # env var unset here). See apps/web/scripts/build.sh.
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"

      - name: Build marketing
        run: npm run build:marketing

  validate-desktop-build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        # Tauri v2's Linux packages (webkit2gtk, javascriptcoregtk, libsoup) moved
        # to the 4.1/3.0 series — this is the official dependency list from
        # https://v2.tauri.app/start/prerequisites/#linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Check Tauri config
        run: |
          cat apps/desktop/src-tauri/tauri.conf.json | jq .

      - name: Validate Rust compilation
        run: cd apps/desktop/src-tauri && cargo check
