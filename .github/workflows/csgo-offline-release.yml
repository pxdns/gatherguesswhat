name: CS Offline - Build Desktop

on:
  push:
    branches: [csgo-offline]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        working-directory: csgo-offline
        run: npm install

      - name: Build frontend
        working-directory: csgo-offline
        run: npm run build

      - name: Build macOS (universal)
        working-directory: csgo-offline
        run: npx tauri build --target universal-apple-darwin

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: cs-offline-macos
          path: csgo-offline/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: csgo-offline
        run: npm install

      - name: Build frontend
        working-directory: csgo-offline
        run: npm run build

      - name: Build Windows
        working-directory: csgo-offline
        run: npx tauri build

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: cs-offline-windows
          path: csgo-offline/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
